<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
      background: #f3f2ef;
      color: #1d2226;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #0a66c2;
    }
    .hint {
      font-size: 11px;
      color: #666;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    #scrapeBtn {
      width: 100%;
      padding: 10px;
      background: #0a66c2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #scrapeBtn:hover { background: #004182; }
    #scrapeBtn:disabled {
      background: #86b7e8;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #444;
      min-height: 18px;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: #ddd;
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
      display: none;
    }
    .progress-bar .fill {
      height: 100%;
      background: #0a66c2;
      border-radius: 2px;
      transition: width 0.3s;
      width: 0%;
    }
    .error { color: #cc1016; }
    .success { color: #057642; }
  </style>
</head>
<body>
  <h1>LinkedIn Job Scraper</h1>
  <div class="hint">Scrapes all pages. Fetches full JD text via API.</div>

  <button id="scrapeBtn">Scrape Jobs</button>

  <div id="status"></div>
  <pre id="diagOutput" style="font-size:9px;max-height:200px;overflow:auto;margin-top:8px;background:#fff;padding:4px;border-radius:4px;display:none;white-space:pre-wrap;word-break:break-all;"></pre>
  <div class="progress-bar" id="progressBar">
    <div class="fill" id="progressFill"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
